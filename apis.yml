aid: claritypediatrics
name: Claritypediatrics
description: 'Clarity Pediatrics is a virtual pediatric telehealth clinic that diagnoses and treats
  ADHD, anxiety, and childhood obesity in children ages 5-17, currently serving families in California
  and Texas. It combines clinical evaluations, medication management, and evidence-based behavioral
  programs — Behavioral Parent Training (BPT) and RUBI for ADHD, the SPACE program and a Teen Anxiety
  Program for anxiety, and lifestyle medicine for obesity — delivered by licensed multispecialty
  clinicians through video visits and weekly group sessions. It is a direct-to-consumer healthcare
  platform (parent app + provider referral) with no public developer or API surface at this time.
  Backed by Homebrew; added to the API Evangelist network from VC-portfolio discovery and enriched
  from its public web presence.'
